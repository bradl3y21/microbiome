[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microbiome"
version = "0.1.0"
description = "Real-genome microbiome simulator: deterministic 2D agent-based simulation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pygame-ce>=2.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
